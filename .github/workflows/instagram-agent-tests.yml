name: Instagram agent tests
on:
  push:
    paths: ['workflows/instagram-publishing/**']
  pull_request:
    paths: ['workflows/instagram-publishing/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workflows/instagram-publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run publication safety tests
        run: python -m unittest -v test_agent.py
      - name: Run offline demo
        run: python tools/demo.py
